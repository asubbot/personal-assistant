# Full quality gate (variant A): same as local `make check`.
# Requires CGO (SQLite / sqlite-vec), gcc, Docker (integration tests), golangci-lint v2 (.golangci.yml format).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit contents:read alone disables other defaults; upload-artifact needs actions:write.
permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AI_SDLC_REPO: asubbot/ai-sdlc
    steps:
      - uses: actions/checkout@v4

      - name: Verify ai-sdlc pin
        run: |
          PIN="$(tr -d '[:space:]' < ai-sdlc.version | grep -v '^#' | tail -1)"
          if git ls-remote "https://github.com/${AI_SDLC_REPO}.git" "refs/tags/${PIN}" | grep -q .; then
            echo "Tag ${PIN} found"
          elif git ls-remote "https://github.com/${AI_SDLC_REPO}.git" "${PIN}" | grep -q .; then
            echo "Commit ${PIN} found"
          else
            echo "Pin ${PIN} not found in ${AI_SDLC_REPO}" >&2
            exit 1
          fi

      - name: Checkout ai-sdlc at pin
        run: |
          PIN="$(tr -d '[:space:]' < ai-sdlc.version | grep -v '^#' | tail -1)"
          if git ls-remote "https://github.com/${AI_SDLC_REPO}.git" "refs/tags/${PIN}" | grep -q .; then
            git clone --depth 1 --branch "${PIN}" "https://github.com/${AI_SDLC_REPO}.git" ai-sdlc
          else
            git clone "https://github.com/${AI_SDLC_REPO}.git" ai-sdlc
            git -C ai-sdlc checkout "${PIN}"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install OS packages (CGO)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
        env:
          CGO_ENABLED: "0"

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build validate binary
        run: make build

      - name: Product check gate
        env:
          CGO_ENABLED: "1"
        run: make check

      - name: Product validate gate
        run: make validate

      - name: Coverage summary
        run: |
          {
            echo "### Test coverage (statements)"
            echo ""
            go tool cover -func=coverage.out | tail -1
            echo ""
            echo "**Layers:** default \`coverage.out\` is from \`go test -tags=integration ./...\` (unit + integration, excludes \`//go:build e2e\` tests). End-to-end jobs flows run in \`make check\` via \`make test-e2e\` (\`./tests/e2e/...\`). E2E-only profile: \`make coverage-e2e\` → \`coverage-e2e.out\`."
            echo ""
            echo "Artifact **coverage-out** contains \`coverage.out\`. View HTML locally: \`go tool cover -html=coverage.out -o coverage.html\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token; artifact upload would fail without actions:write (not granted to forks).
      - name: Upload coverage profile
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out
          if-no-files-found: error

      # Same visibility as artifact upload: fork PRs do not receive CODECOV_TOKEN.
      - name: Upload coverage reports to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Go -coverprofile=coverage.out; explicit path avoids silent "no reports" uploads.
          files: coverage.out
          disable_search: true

      - name: Verify working tree clean after fmt
        run: git diff --exit-code
