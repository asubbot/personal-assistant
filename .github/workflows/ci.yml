# Full quality gate (variant A): same as local `make check`.
# Requires CGO (SQLite / sqlite-vec), gcc, Docker (integration tests), golangci-lint v2 (.golangci.yml format).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install OS packages (CGO)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
        env:
          CGO_ENABLED: "0"

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make check
        env:
          CGO_ENABLED: "1"
        run: make check

      - name: Coverage summary
        run: |
          {
            echo "### Test coverage (statements)"
            echo ""
            go tool cover -func=coverage.out | tail -1
            echo ""
            echo "Artifact **coverage-out** contains \`coverage.out\`. View HTML locally: \`go tool cover -html=coverage.out -o coverage.html\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out
          if-no-files-found: error

      - name: Verify working tree clean after fmt
        run: git diff --exit-code
