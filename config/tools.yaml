# Tool catalog (single source of truth). Required by config. Add tools as needed for EP-004.
tools:

  - id: node_time
    short_description: Get current date and time on the node.
    template: "date -Iseconds"
    node_id: nas
    arguments: []
    triggers:
      - "what time is it on the node"
      - "node time"
      - "date on server"

  - id: sonos
    short_description: >-
      USE HERMES ONLY FORMAT: <tool_call>{"name":"sonos","arguments":{"speaker":"<room>","tail":"<action>"}}</tool_call>.
      Do not output <sonos>. speaker examples: Bedroom, "Living Room". tail examples: stop, play, next, pause, volume 25, etc.
    template: "/volume1/homes/openclaw-runner/.local/bin/sonos {{speaker}} {{tail}}"
    node_id: nas
    arguments:
      - name: speaker
        required: true
        type: string
      - name: tail
        required: true
        type: string
    triggers:
      - "sonos"
      - "music"
