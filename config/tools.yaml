# Tool catalog (single source of truth). Required by config. Add tools as needed for EP-004.
tools:

  - id: node_time
    short_description: Get current date and time on the node.
    template: "date -Iseconds"
    node_id: nas
    arguments: []
    triggers:
      - "what time is it on the node"
      - "node time"
      - "date on server"
