# PersonalAssistant — Docker Compose base (no fixed image platform).
# For an explicit single-arch build, use:
#   docker compose -f docker-compose.arm64.yml ...   (Apple Silicon / ARM64 Linux)
#   docker compose -f docker-compose.amd64.yml ...   (Intel/AMD / Synology x86_64)
# Plain `docker compose up --build` uses this file only: BuildKit targets the host architecture.
# Uses host .config/ (mounted read-only) and .secrets/; set PA_DATA_DIR and PA_SECRETS_DIR so relative paths resolve. See docs/docker.md.

secrets:
  telegram_bot_token:
    file: ./.secrets/telegram_bot_token.txt
  telegram_users:
    file: ./.secrets/telegram_users.json
  openai_api_key:
    file: ./.secrets/openai_api_key
  zai_api_key:
    file: ./.secrets/zai_api_key
  # Node SSH key: basename must match nodes.*.auth.private_key_path in config (resolves under PA_SECRETS_DIR).
  node_ssh_private_key:
    file: ./.secrets/node_ssh_private_key

volumes:
  pa_data:

services:
  pa:
    build:
      context: .
    restart: unless-stopped
    # Optional: copy .env.example → .env for PA_LOG_LEVEL etc. (see docs/docker.md).
    env_file:
      - path: .env
        required: false
    # Config uses bare filenames; PA_SECRETS_DIR=/run/secrets → /run/secrets/<name>.
    secrets:
      - source: telegram_bot_token
        target: /run/secrets/telegram_bot_token.txt
      - source: telegram_users
        target: /run/secrets/telegram_users.json
      - source: openai_api_key
        target: /run/secrets/openai_api_key
      - source: zai_api_key
        target: /run/secrets/zai_api_key
      - source: node_ssh_private_key
        target: /run/secrets/node_ssh_private_key
    volumes:
      - ./.config:/etc/pa:ro
      - pa_data:/data
    # Overrides .env: paths must match container layout. PA_LOG_LEVEL defaults to info in-app if unset.
    environment:
      - PA_CONFIG_DIR=/etc/pa
      - PA_DATA_DIR=/data
      - PA_SECRETS_DIR=/run/secrets
      - PA_LOG_LEVEL=${PA_LOG_LEVEL:-info}
