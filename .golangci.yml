version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - gocyclo
    - misspell
    - errorlint
    - nilerr
    - bodyclose
    - sloglint
    - nolintlint
  settings:
    gocyclo:
      min-complexity: 12
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
    - gofumpt
  exclusions:
    generated: lax
