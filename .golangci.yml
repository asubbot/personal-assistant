version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - gocyclo
    - misspell
    - errorlint
    - nilerr
    - bodyclose
    - sloglint
    - nolintlint
    - gosec
    - contextcheck
    - noctx
    - revive
    - gocritic
    - unparam
    - forbidigo
    - copyloopvar
    - durationcheck
    - fatcontext
    - loggercheck
    - mirror
    - paralleltest
    - thelper
  settings:
    gocyclo:
      min-complexity: 12
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G301   # dir permissions 0755 acceptable for app-created dirs
        - G302   # file permissions 0644 acceptable for logs/summaries
        - G306   # WriteFile 0644 acceptable
        - G304   # path from variable: paths from validated config, not user input
        - G101   # constant IDs (e.g. redaction) and test fixtures, not secrets
        - G703   # path traversal: dir/path from config
        - G704   # SSRF: HTTP URLs from config (operator-controlled)
        - G204   # exec in test (fixed "go run" args)
    revive:
      severity: warning
      rules:
        - name: unreachable-code
        - name: error-return
        - name: error-naming
        - name: indent-error-flow
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: empty-lines
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # high noise / false positives (e.g. filepath.Join in tests with fixture paths)
        - hugeParam
        - rangeValCopy
        - ptrToRefParam
        - filepathJoin
        - paramTypeCombine
        - tooManyResultsChecker
        - unnamedResult
        - builtinShadow
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print
          msg: use structured logging (log/slog) instead of fmt.Print*
        - pattern: io/ioutil\.
          msg: io/ioutil is deprecated; use os or io packages
    paralleltest:
      # Do not require t.Parallel() on every test (would be hundreds of edits; many tests use env/tempdir).
      # Still flags incorrect use of t.Parallel (e.g. unsafe subtests).
      ignore-missing: true
  exclusions:
    generated: lax
    rules:
      # validate is a CLI that prints human-readable reports to stdout (fmt), not a server.
      - path: ai-sdlc/tools/validate/
        linters:
          - forbidigo
          - gocyclo
          - nilerr
          - gocritic
          - errcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - ai-sdlc/tools/validate/
