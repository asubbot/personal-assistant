# Tool catalog — single source of truth for invocable tools.
#
# id            — Stable identifier.
# index_text    — Short description: what the tool does. Used for the vector index (pre-selection) and as native tool-calling description.
# system_prompt — Optional: longer rules for the model; appended to system when this tool is among the selected tools.
# template      — Command on the node with {{placeholder}} arguments.
# node_id       — Node id from config (SSH / run_on_node).
# arguments     — Argument schema (name, type, required, …).
# triggers      — Optional: example user phrases for embedding / pre-selection only (not added to system prompt).

tools:

  - id: node_time
    index_text: Return the current date and time from the NAS node (ISO 8601).
    system_prompt: When the user asks for the current time or date on the server/NAS, call node_time. Do not invent timestamps.
    template: "date -Iseconds"
    node_id: nas
    arguments: []
    triggers: ["what time is it", "time", "date"]

  - id: sonos
    index_text: "Control Sonos on the NAS: play, pause, skip, volume by room name (speaker) and action string (tail)."
    system_prompt: |
      For sonos: speaker must be the Sonos room name as the user says it (e.g. Bedroom, "Living Room").
      tail is a single CLI tail passed to the sonos script: e.g. stop, play, next, pause, status, volume 30.
      Do not add shell metacharacters. If the user is vague about the room, ask once before calling.
    template: "/volume1/homes/openclaw-runner/.local/bin/sonos {{speaker}} {{tail}}"
    node_id: nas
    arguments:
      - { name: speaker, required: true, type: string }
      - { name: tail, required: true, type: string }
    triggers: ["sonos", "music", "play", "stop", "volume", "next", "previous", "включи", "выключи", "громкость"]
